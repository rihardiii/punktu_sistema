# Punktu sistēma — Dockge / docker compose stack for TrueNAS SCALE
#
# Paste this into Dockge as a new stack named "punkti".
#
# Before the first start:
#
#   1. Log the NAS in to GHCR once (the package is private).
#      DOCKER_CONFIG is needed because the TrueNAS shell often runs with
#      HOME=/var/empty, and docker login fails there with
#      "mkdir /var/empty/.docker: operation not permitted".
#      It prompts for a password — paste the token there rather than putting
#      it on the command line, where it would land in your shell history.
#
#        sudo mkdir -p /mnt/apps/.docker
#        sudo DOCKER_CONFIG=/mnt/apps/.docker docker login ghcr.io -u rihardiii
#
#   2. Pull the image from the shell (Dockge cannot: it runs in its own
#      container and does not see the credentials you just created):
#
#        sudo DOCKER_CONFIG=/mnt/apps/.docker docker pull ghcr.io/rihardiii/punktu_sistema:latest
#
#   3. Create the data directory:
#        mkdir -p /mnt/apps/punkti/data
#
# To update: repeat step 2, then Dockge → punkti → Restart. Compose only pulls
# when the image is missing locally, so the freshly pulled one is used as is.
#
# Making the GHCR package public (the repo can stay private) removes all of the
# above and makes Dockge's Update button work — see the README.
#
# The container starts as root, chowns /data and then drops to an
# unprivileged user, so the directory's owner on the host does not matter.

services:
  punkti:
    # Pin a version instead of :latest if you would rather choose exactly when
    # the app changes — e.g. ghcr.io/rihardiii/punktu_sistema:0.7.0
    image: ghcr.io/rihardiii/punktu_sistema:latest
    container_name: punkti
    restart: unless-stopped

    ports:
      # Pick any free host port; 4173 does not clash with AdGuard Home.
      - 4173:4173

    volumes:
      # The family's entire history is one SQLite file in here.
      # Snapshot this dataset — it is the only thing that cannot be rebuilt.
      - /mnt/apps/punkti/data:/data

    environment:
      PUNKTI_DB: /data/punkti.sqlite
      HOST: 0.0.0.0
      PORT: "4173"
      # Container log timestamps only — the UI always renders times in each
      # device's own timezone.
      TZ: Europe/Riga

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks: {}
