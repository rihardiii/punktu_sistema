# Punktu sistēma — Dockge / docker compose stack for TrueNAS SCALE
#
# Paste this into Dockge as a new stack named "punkti".
#
# Before the first start:
#
#   1. Log the NAS in to GHCR once (the package is private):
#        echo "<PAT ar read:packages>" | docker login ghcr.io -u rihardiii --password-stdin
#   2. Create the data directory:
#        mkdir -p /mnt/apps/punkti/data
#
# To update: Dockge → punkti → Update (pulls the new image and restarts),
# or from a shell: docker compose pull && docker compose up -d
#
# The container starts as root, chowns /data and then drops to an
# unprivileged user, so the directory's owner on the host does not matter.

services:
  punkti:
    # Pin a version instead of :latest if you would rather choose exactly when
    # the app changes — e.g. ghcr.io/rihardiii/punktu_sistema:0.7.0
    image: ghcr.io/rihardiii/punktu_sistema:latest
    container_name: punkti
    restart: unless-stopped

    ports:
      # Pick any free host port; 4173 does not clash with AdGuard Home.
      - 4173:4173

    volumes:
      # The family's entire history is one SQLite file in here.
      # Snapshot this dataset — it is the only thing that cannot be rebuilt.
      - /mnt/apps/punkti/data:/data

    environment:
      PUNKTI_DB: /data/punkti.sqlite
      HOST: 0.0.0.0
      PORT: "4173"
      # Container log timestamps only — the UI always renders times in each
      # device's own timezone.
      TZ: Europe/Riga

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks: {}
