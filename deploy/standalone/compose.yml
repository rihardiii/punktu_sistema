# Scoreboard — "copy the folder and run it" stack.
#
# No git on the NAS, no registry, no tokens. You copy the project folder onto
# a TrueNAS share and this runs it straight from those files using the stock
# Node image. To update: rebuild on your PC, copy the folder over again,
# restart the stack.
#
# ---------------------------------------------------------------------------
# ONE-OFF SETUP
#
#   1. On your PC, in the project folder:
#          npm install
#          npm run build
#
#   2. Copy everything EXCEPT node_modules, .git and data to the NAS, into:
#          /mnt/apps/scoreboard/app
#      (\\<nas>\apps\scoreboard\app over SMB is fine)
#
#      Do NOT copy node_modules — better-sqlite3 contains a compiled binary
#      built for Windows, which cannot run in a Linux container. The container
#      installs the Linux version itself on first start.
#
#   3. Create the database directory on the NAS:
#          mkdir -p /mnt/apps/scoreboard/data
#
#   4. Paste this file into Dockge as a stack and Deploy.
#
# First start takes a few minutes while dependencies install. Later starts are
# quick. Watch progress in Dockge's log pane.
#
# ---------------------------------------------------------------------------
# UPDATING
#
#   1. On your PC:  npm run build
#   2. Copy the folder over again (overwrite).
#   3. Dockge → scoreboard → Restart.
#
# Only re-run the dependency install if package-lock.json changed — the
# container detects that automatically.
# ---------------------------------------------------------------------------

services:
  scoreboard:
    # Stock Node image — nothing to build, nothing to pull from a registry.
    # The full (non-slim) image is used because it already carries python3 and
    # a C++ toolchain, which better-sqlite3 needs if no prebuilt binary matches.
    image: node:24-bookworm
    container_name: scoreboard
    restart: unless-stopped
    working_dir: /app

    ports:
      - 24173:24173

    volumes:
      # The project files you copied over.
      - /mnt/apps/scoreboard/app:/app
      # The database. Keep this separate from the app folder so overwriting
      # the app can never touch the family's points.
      - /mnt/apps/scoreboard/data:/data

    environment:
      # The app reads PUNKTI_DB. The filename is yours to choose.
      PUNKTI_DB: /data/scoreboard.sqlite
      HOST: 0.0.0.0
      PORT: "24173"
      TZ: Europe/Riga
      NODE_ENV: production

    # Written inline rather than as a .sh file on purpose: a shell script copied
    # from Windows arrives with CRLF line endings and fails with a confusing
    # "no such file or directory". Dockge writes this compose file with LF.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /app

        if [ ! -f server/dist/index.js ] || [ ! -f web/dist/index.html ]; then
          echo "[start] ERROR: server/dist or web/dist is missing."
          echo "[start] Run 'npm run build' on your PC, then copy the folder again."
          exit 1
        fi

        # node_modules is platform-specific, so it is installed here rather than
        # copied. The require() probe also self-heals the common mistake of
        # copying a Windows-built node_modules across.
        NEED_INSTALL=0
        node -e "require('better-sqlite3')" >/dev/null 2>&1 || NEED_INSTALL=1
        if [ -f package-lock.json ]; then
          LOCK=$$(md5sum package-lock.json | cut -d' ' -f1)
          [ "$$(cat .deps-stamp 2>/dev/null)" = "$$LOCK" ] || NEED_INSTALL=1
        fi

        if [ "$$NEED_INSTALL" = "1" ]; then
          echo "[start] installing dependencies (first run takes a few minutes)..."
          rm -rf node_modules
          npm ci --omit=dev --foreground-scripts
          [ -f package-lock.json ] && md5sum package-lock.json | cut -d' ' -f1 > .deps-stamp
          echo "[start] dependencies ready"
        fi

        echo "[start] starting Scoreboard on port $$PORT"
        exec node server/dist/index.js

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:24173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      # Generous: the first start installs dependencies before listening.
      start_period: 300s
      retries: 3

networks: {}
