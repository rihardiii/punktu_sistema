name: CI

# Builds and publishes the container image on every push to main, so a NAS
# running Watchtower picks up new versions automatically.
#
# The publish job depends on the test job: if typecheck, build or the API test
# suite fails, no image is pushed and the family keeps running the last good
# version instead of auto-updating into a broken one.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Typecheck, build and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # better-sqlite3 needs its install script to fetch the native binding;
      # npm 11 gates lifecycle scripts behind package.json's "allowScripts".
      - run: npm ci --foreground-scripts

      - run: npm run typecheck

      - run: npm run build

      - name: Run the API test suite against the built server
        run: |
          PUNKTI_DB="$RUNNER_TEMP/ci.sqlite" PORT=4199 node server/dist/index.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4199/api/health >/dev/null && break
            sleep 1
          done
          BASE=http://localhost:4199 bash server/test/smoke.sh

  publish:
    name: Publish image to GHCR
    needs: test
    # Pull requests must not publish — they would overwrite :latest.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the app version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      # TrueNAS SCALE is x86-64 only, so a single-arch image keeps builds fast.
      # Add linux/arm64 here if you ever run this on a Pi.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
